server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router: ogni rotta client-side (es. /projects/123) deve
    # ricevere comunque index.html, non un 404, altrimenti un refresh o un
    # link diretto a una rotta interna rompe la navigazione.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
